fail-on-severity: "medium"

# List of vulnerabilities to ignore for the anchore scan
# https://github.com/anchore/grype#specifying-matches-to-ignore
# More info can be found in the docs/infra/vulnerability-management.md file

# Please add safelists in the following format to make it easier when checking
# Package/module name: URL to vulnerability for checking updates
#  Versions:     URL to the version history
#  Dependencies: Name of any other packages or modules that are dependent on this version
#                 Link to the dependencies for ease of checking for updates
#  Issue:         Why there is a finding and why this is here or not been removed
#  Last checked:  Date last checked in scans
# - vulnerability: The-CVE-or-vuln-id # Remove comment at start of line

ignore:
  # These settings ignore any findings that fall into these categories
  - fix-state: not-fixed
  - fix-state: wont-fix
  - fix-state: unknown

  # zipfile: bzip2/LZMA/Zstandard members pre-allocate memory from an
  # attacker-controlled size
  # Fix only in pre-release Python 3.15 (3.15.0rc2); fix in GA 3.14.8
  # https://github.com/HHS/simpler-grants-gov/issues/8109
  # Last checked: 10/02/2026
  - vulnerability: CVE-2026-15310

  # Not fixed in GA Python yet
  # https://github.com/HHS/simpler-grants-gov/issues/8109
  # Last checked: 10/02/2026
  - vulnerability: CVE-2025-15367

  # urllib.request.HTTPPasswordMgr: stored credentials matched without regard to
  # URL scheme, so https:// credentials were reused over http://
  # Fix only in pre-release Python 3.15 (3.15.0rc2); fix in GA 3.14.8
  # https://github.com/HHS/simpler-grants-gov/issues/8109
  # Last checked: 10/02/2026
  - vulnerability: CVE-2026-15806

  # stringprep / idna codec: RFC 3454 tables B.2 and B.3 matched against current
  # Unicode attributes instead of Unicode 3.2.0
  # Fix only in pre-release Python 3.15 (3.15.0rc2); fix in GA 3.14.8
  # https://github.com/HHS/simpler-grants-gov/issues/8109
  # Last checked: 10/02/2026
  - vulnerability: CVE-2026-17084

  # dompurify via isomorphic-dompurify
  # Major version upgrade required, will do after 8/12 release
  # Last checked: 08/11/2026
  - vulnerability: GHSA-55q2-fjhq-7xh7

  # tarfile: hardlink fallback ignores a custom extraction filter's None result.
  # Python 3.14.8 is still affected; the 3.14 backport merged after that release.
  # Grype lists fixes in 3.12.15, 3.13.16 and pre-release 3.15.0, but there is
  # no released fix on our 3.14 runtime line yet. Remove this exception once
  # python:3.14-slim includes the backport and Grype recognizes the fixed version.
  # Advisory: https://www.cve.org/CVERecord?id=CVE-2026-87910
  # Backport: https://github.com/python/cpython/pull/157307
  # https://github.com/HHS/simpler-grants-gov/issues/8109
  # Last checked: 10/02/2026
  - vulnerability: CVE-2026-87910

  # tempfile.TemporaryDirectory: race condition in cleanup lets an attacker who
  # can modify the tree swap a directory for a symlink, so files outside the
  # temporary directory can be deleted or have permissions/flags reset.
  # Python 3.14.8 is still affected. The fix is merged for 3.15 (3.15.0rc3) but
  # has not been backported to 3.14, and there is no released 3.14 fix. Grype
  # lists the fix only in 3.15.0. Remove this exception once python:3.14-slim
  # includes a fixed 3.14 release and Grype recognizes it.
  # Advisory: https://www.cve.org/CVERecord?id=CVE-2026-12345
  # Upstream issue: https://github.com/python/cpython/issues/157579
  # https://github.com/HHS/simpler-grants-gov/issues/8109
  # Last checked: 10/03/2026
  - vulnerability: CVE-2026-12345
  # CPython, tarfile issue with checking files on file systems that don't support symlinks, so not us
  # might be fixed in 3.14.8 but that just came out
  # https://github.com/python/cpython/issues/157265
  # Last checked: 10/02/2026
  - vulnerability: CVE-2026-87910
