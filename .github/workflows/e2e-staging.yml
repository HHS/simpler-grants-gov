name: E2E Tests (Deployed Target)
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      version:
        description: "git reference for testing code to run (e.g., a branch, tag, or commit SHA)"
        required: true
        type: string
      target:
        description: "application environment to run tests against (dev / prod TK)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - grantee1
          - grantee2
          - grantor1
          - grantor2
      playwright_tags:
        description: "pipe separated list of @tags denoting groups of tests to run (e.g. @smoke|@core-regression). Leave blank to run all tests"
        type: string
  workflow_call:
    inputs:
      version:
        description: "git reference for testing code to run (e.g., a branch, tag, or commit SHA)"
        required: true
        type: string
      target:
        description: "application environment to run tests against (dev / prod TK)"
        default: "staging"
        type: string
      playwright_tags:
        description: "pipe separated list of @tags denoting groups of tests to run (e.g. @smoke|@core-regression). Leave blank to run all tests"
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ inputs.target || 'staging' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-tests-deployed:
    name: E2E ${{ matrix.projects }} ${{ matrix.shard }}/${{ matrix.total_shards }}
    runs-on: ubuntu-22.04
    # Shard across runners rather than raising the per-runner worker count: the
    # deployed suite keeps workers at 1 (see the workers input below) because
    # every test authenticates as one of a handful of static shared test users,
    # so in-process parallelism is the riskier way to add concurrency.
    #
    # Each project gets its own shard count instead of sharing one matrix. On a
    # deployed target, most spec files skip everything but Chrome (see
    # utils/auth/skip-non-chrome-staging-utils.ts), so most Mobile chrome tests
    # skip at runtime — but Playwright balances shards by collected test count,
    # which means a shared matrix hands whole runners work that evaporates in
    # seconds while the Chrome shards carry everything.
    strategy:
      # A scheduled regression run wants results for every shard, not an early exit.
      fail-fast: false
      matrix:
        include:
          - { projects: "Chrome", shard: 1, total_shards: 6, label: chrome-1 }
          - { projects: "Chrome", shard: 2, total_shards: 6, label: chrome-2 }
          - { projects: "Chrome", shard: 3, total_shards: 6, label: chrome-3 }
          - { projects: "Chrome", shard: 4, total_shards: 6, label: chrome-4 }
          - { projects: "Chrome", shard: 5, total_shards: 6, label: chrome-5 }
          - { projects: "Chrome", shard: 6, total_shards: 6, label: chrome-6 }
          - {
              projects: "Mobile chrome",
              shard: 1,
              total_shards: 1,
              label: mobile-1,
            }
    steps:
      - name: Set target environment
        run: |
          if [[ -z "${{ inputs.target }}" ]]; then
            echo "defaulted_target=staging" >> "$GITHUB_ENV";
          else
            echo "defaulted_target=${{ inputs.target }}" >> "$GITHUB_ENV";
          fi
      - name: Check target environment
        run: |
          if [[ "${{ env.defaulted_target }}" != "staging" && "${{ env.defaulted_target }}" != "grantee1" && "${{ env.defaulted_target }}" != "grantee2" && "${{ env.defaulted_target }}" != "grantor1" && "${{ env.defaulted_target }}" != "grantor2" ]]; then
            echo "Unsupported target environment"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Determine test groups to run
        shell: bash
        run: |
          if [[ $GITHUB_EVENT_NAME = "push" ]]; then
            echo "test_group_tags=@smoke|@core-regression" >> "$GITHUB_ENV"
          else
            echo "test_group_tags=${{ inputs.playwright_tags }}" >> "$GITHUB_ENV"
          fi
      - name: Run E2E tests
        uses: ./.github/actions/e2e
        with:
          version: ${{ inputs.version || github.ref }}
          target: ${{ env.defaulted_target }}
          total_shards: ${{ matrix.total_shards }}
          current_shard: ${{ matrix.shard }}
          playwright_projects: ${{ matrix.projects }}
          shard_label: ${{ matrix.label }}
          workers: 1
          playwright_tags: ${{ env.test_group_tags }}
          staging_test_user_email: ${{ secrets.STAGING_TEST_USER_EMAIL }}
          staging_test_user_password: ${{ secrets.STAGING_TEST_USER_PASSWORD }}
          staging_test_user_mfa_key: ${{ secrets.STAGING_TEST_USER_MFA_KEY }}
          staging_client_session_secret: ${{ secrets.STAGING_CLIENT_SESSION_SECRET }}
          test_user_manager_api_key: ${{ secrets.STAGING_TEST_USER_MANAGER_API_KEY }}
          do-chrome-install: "true"
  create-report:
    name: Create Merged Test Report
    if: ${{ !cancelled() }}
    needs: e2e-tests-deployed
    uses: ./.github/workflows/e2e-create-report.yml
    secrets: inherit
    with:
      run_id: ${{ github.run_id }}
      target: ${{ inputs.target }}
  send-slack-notification:
    if: failure()
    needs: [create-report]
    uses: ./.github/workflows/send-slack-notification.yml
    with:
      "channel_id": "alerts-e2e"
    secrets: inherit
