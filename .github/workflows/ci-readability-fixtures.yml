name: Test Readability Calculator fixtures

on:
  pull_request:
    paths:
      - scripts/build_readability_fixtures.py
      - scripts/readability_fixture_requirements.txt
      - scripts/tests/test_readability_fixtures.py
      - scripts/tests/fixtures/readability/**
      - .github/workflows/ci-readability-fixtures.yml
  push:
    branches: [main]
    paths:
      - scripts/build_readability_fixtures.py
      - scripts/readability_fixture_requirements.txt
      - scripts/tests/test_readability_fixtures.py
      - scripts/tests/fixtures/readability/**
      - .github/workflows/ci-readability-fixtures.yml

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline fixture tooling
        run: python -m pip install -r scripts/readability_fixture_requirements.txt
      - name: Check fictional fixture integrity and generation
        run: python -m unittest discover -s scripts/tests -p test_readability_fixtures.py -v
