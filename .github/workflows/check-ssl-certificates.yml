name: Check SSL Certificates for ones expiring soon

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: "infra-dev"
        type: choice
        options:
          - dev
          - infra-dev
          - staging
          - infra-staging
          - training
          - infra-training
          - prod
  push:
    branches: mdragon/13582-ssl-checker
  schedule:
    # Run every day at (8am ET, 5am PT) before the start of the workday
    - cron: "0 12 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  check-ssl-certificates:
    name: Check SSL Certificates
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # Selecting dev, staging or training deploys the infra-dev / infra-staging / infra-training environment
        envs: ${{ github.event_name == 'schedule' && 'prod' || fromJSON(inputs.environment != null && format('["{0}"]', inputs.environment == 'dev' && 'infra-dev' || inputs.environment == 'staging' && 'infra-staging' || inputs.environment == 'training' && 'infra-training' || inputs.environment) || github.ref_name == 'main' && '["infra-staging"]' || '["infra-dev"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Configure AWS credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          app_name: "api"
          environment: ${{ matrix.envs }}

      - name: Dump the certificate metadata
        run: |
          pwd
          aws acm list-certificates --max-items 1000 --no-paginate --includes "keyTypes=RSA_1024,RSA_2048,RSA_3072,RSA_4096,EC_prime256v1,EC_secp384r1,EC_secp521r1" > certificates.json
          ls -l

      - name: Parse the results
        uses: ./.github/actions/ssl-checker

  send-slack-notification:
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [check-ssl-certificates]
    uses: ./.github/workflows/send-slack-notification.yml
    secrets: inherit
