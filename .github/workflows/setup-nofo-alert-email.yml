name: Set up private NOFO alert email
run-name: Create private NOFO alert parameter in infra-dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-nofo-alert-email-infra-dev
  cancel-in-progress: false

jobs:
  setup:
    if: github.repository == 'HHS/simpler-grants-gov' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned AWS SDK
        run: python3 -m pip install -r scripts/nofo_alert_setup_requirements.txt
      - name: Validate private input before authentication
        env:
          NOFO_INFRA_DEV_ALERT_EMAIL: ${{ secrets.NOFO_INFRA_DEV_ALERT_EMAIL }}
        run: python3 scripts/create_nofo_alert_parameter.py --validate-only
      - name: Load create-only session policy
        id: policy
        run: echo "json=$(jq -c . scripts/nofo_alert_setup_session_policy.json)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to infra-dev for one parameter creation
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::061664787759:role/simpler-grants-gov-github-actions
          role-session-name: NofoPrivateAlertSetup
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 2
          inline-session-policy: ${{ steps.policy.outputs.json }}
      - name: Create encrypted parameter without overwriting
        env:
          NOFO_INFRA_DEV_ALERT_EMAIL: ${{ secrets.NOFO_INFRA_DEV_ALERT_EMAIL }}
        run: python3 scripts/create_nofo_alert_parameter.py
