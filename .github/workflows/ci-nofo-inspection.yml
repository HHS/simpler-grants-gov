name: Test Readability Calculator inspection

on:
  pull_request:
    paths:
      - scripts/inspect_nofo_readability.py
      - scripts/nofo_inspection_session_policy.json
      - scripts/tests/test_nofo_inspection.py
      - .github/workflows/inspect-nofo-readability.yml
      - .github/workflows/ci-nofo-inspection.yml
  push:
    branches: [main]
    paths:
      - scripts/inspect_nofo_readability.py
      - scripts/nofo_inspection_session_policy.json
      - scripts/tests/test_nofo_inspection.py
      - .github/workflows/inspect-nofo-readability.yml
      - .github/workflows/ci-nofo-inspection.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline inspection tests (no AWS credentials or network)
        run: python3 -m unittest discover -s scripts/tests -p test_nofo_inspection.py -v
