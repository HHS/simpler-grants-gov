name: Verify Readability Calculator runtime - dev
on:
  workflow_dispatch:
    inputs:
      check:
        description: Synthetic check to run
        type: choice
        default: runtime
        options:
          - runtime
          - interruption
permissions:
  contents: read
concurrency:
  group: cd-nofos-infra-dev
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'HHS/simpler-grants-gov' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
      - name: Authenticate to NOFO dev
        uses: ./.github/actions/configure-aws-credentials
        with:
          app_name: nofos
          environment: infra-dev
      - name: Verify synthetic processing in a separate dev task
        env:
          NOFO_READABILITY_CHECK: ${{ inputs.check }}
        run: python3 .github/scripts/nofo_readability/run_dev.py
