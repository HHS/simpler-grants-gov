emit:
  - simpler-forms
  - form-library-xml
  - simpler-forms-sgg
options:
  simpler-forms:
    emitter-output-dir: "{project-root}/dist/canonical"
    property-casing: snake
  form-library-xml:
    emitter-output-dir: "{project-root}/dist/canonical"
    mapping-targets: [grantsGovXml]
    property-casing: snake
  simpler-forms-sgg:
    emitter-output-dir: "{project-root}/dist/sgg"
    property-casing: snake
