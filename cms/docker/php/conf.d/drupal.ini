; PHP settings for Drupal, applied in every image stage

expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 32M
post_max_size = 32M

; Only /tmp is writable in the release image
sys_temp_dir = /tmp
upload_tmp_dir = /tmp

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

apc.shm_size = 64M
