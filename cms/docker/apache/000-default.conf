<VirtualHost *:8000>
    DocumentRoot /app/web

    <Directory /app/web>
        Options FollowSymLinks
        # Drupal's .htaccess handles clean URLs and blocks access to sensitive files
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
